name: Publisher [Bot]

on:
  schedule:
    # Se lance tous les jours à 09H12 & 16H12 Paris (pour éviter les embouteillages des serveurs)
    - cron: '12 7,14 * * *'
  workflow_dispatch:
    # Permet de lancer le script manuellement depuis l'interface GitHub

jobs:
  publier_video:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: 🐍 Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ⚙️ Installer FFmpeg (analyse loudness)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 📦 Installer les dépendances
        run: pip install requests

      - name: 🚀 Lancer le script de publication
        env:
          # Connexion sécurisée avec tes secrets GitHub
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          TIKTOK_ACCOUNT_ID: ${{ secrets.TIKTOK_ACCOUNT_ID }}
          YOUTUBE_ACCOUNT_ID: ${{ secrets.YOUTUBE_ACCOUNT_ID }}
        run: python publish.py

      - name: 💾 Sauvegarder le rapport de loudness (si généré)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Loudness-Report-Publish-${{ github.run_id }}
          path: loudness_report.txt
          if-no-files-found: ignore

