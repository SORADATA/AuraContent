name: Publisher [Bot]

on:
  workflow_dispatch:
  schedule:   # 09H12 & 16h12 publiés sur tiktotk
    - cron: "12 7 * * *"
    - cron: "12 14 * * *"

jobs:
  publier_video:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: 🐍 Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: ⚙️ Installer FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 📦 Installer les dépendances minimales
        run: pip install requests

      - name: 🚀 Lancer le script de publication
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          TIKTOK_ACCOUNT_ID: ${{ secrets.TIKTOK_ACCOUNT_ID }}
          YOUTUBE_ACCOUNT_ID: ${{ secrets.YOUTUBE_ACCOUNT_ID }}
        run: python publish.py

      - name: 💾 Sauvegarder le rapport de loudness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Loudness-Report-Publish-${{ github.run_id }}
          path: loudness_report.txt
          if-no-files-found: ignore
