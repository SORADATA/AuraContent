name: 🧪 Test Scraper Videos (yt-dlp)

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Mots-clés de recherche YouTube (anglais)"
        required: false
        default: "CGI dark fantasy cinematic 9:16"

jobs:
  test_ytdlp:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4

      - name: ⚙️ Installer FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 🐍 Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install yt-dlp

      - name: 🧪 Tester le téléchargement avec yt-dlp
        run: |
          python -c "
          import os
          from modules.video_scraper import VideoScraper

          print('🚀 Lancement du test VideoScraper...')
          scraper = VideoScraper()
          input_query = '${{ github.event.inputs.query }}'

          bg_path, title = scraper.search_and_download(query=input_query, output_filename='test_bg.mp4')

          if bg_path and os.path.exists(bg_path):
              print(f'✅ SUCCÈS : Vidéo téléchargée avec succès !')
              print(f'📌 Titre : {title}')
              print(f'📁 Chemin : {bg_path}')
              print(f'📦 Taille : {os.path.getsize(bg_path) / (1024*1024):.2f} Mo')
          else:
              print('❌ ÉCHEC : Impossible de récupérer la vidéo.')
              exit(1)
          "

      - name: 💾 Sauvegarder la vidéo téléchargée (Artéfact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Video-Test-YtDlp-${{ github.run_id }}
          path: assets/backgrounds/test_bg.mp4
          if-no-files-found: warn
