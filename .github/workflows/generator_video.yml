name: Générateur de Vidéos IA

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Sujet de la vidéo'
        required: true
        default: 'Le mystère des pyramides'

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Cloner le dépôt
      uses: actions/checkout@v4

    - name: ⚙️ Installer FFmpeg (Moteur vidéo)
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: 🐍 Configurer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 Installer les dépendances
      run: pip install -r requirements.txt

    - name: 🎬 Générer la vidéo
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        TOPIC: ${{ github.event.inputs.topic }}
      run: python main.py 

    - name: 💾 Sauvegarder la vidéo finale
      uses: actions/upload-artifact@v4
      with:
        name: Video-TikTok-Prete
        path: assets/final/final_short.mp4
