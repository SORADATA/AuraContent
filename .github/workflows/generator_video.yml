name: Générateur de Vidéos IA

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Sujet de la video (laisser vide pour choix automatique par l'IA)"
        required: false
        default: ""
      duration:
        description: "Duree souhaitee en secondes (20 a 90)"
        required: false
        default: "45"
      refine_angle:
        description: "Laisser l'IA reformuler l'angle du sujet"
        required: false
        default: "true"

  schedule:
    - cron: "17 4 * * *" # 06h17 heure de Paris
    - cron: "43 10 * * *" # 12h43 heure de Paris

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Cloner le dépôt
      uses: actions/checkout@v4

    - name: ⚙️ Installer FFmpeg (Moteur vidéo)
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: 🐍 Configurer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 🗃️ Cache des modèles Hugging Face (Kokoro TTS)
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: ${{ runner.os }}-huggingface-kokoro-v1
        restore-keys: |
          ${{ runner.os }}-huggingface-kokoro-

    - name: 📦 Installer les dépendances
      run: pip install -r requirements.txt

    - name: 🎬 Générer la vidéo
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        VIDEO_TOPIC: ${{ github.event.inputs.topic }}
        VIDEO_DURATION: ${{ github.event.inputs.duration || '45' }}
        REFINE_ANGLE: ${{ github.event.inputs.refine_angle || 'true' }}
      run: python main.py

    - name: 🔊 Vérifier le niveau sonore (voix / musique)
      run: |
        ffmpeg -i assets/final/final_short.mp4 -af loudnorm=print_format=summary -f null - 2>&1 | tee loudness_report.txt

    - name: 💾 Sauvegarder le rapport de loudness
      uses: actions/upload-artifact@v4
      with:
        name: Loudness-Report-${{ github.run_id }}
        path: loudness_report.txt

    - name: 💾 Sauvegarder la vidéo finale
      uses: actions/upload-artifact@v4
      with:
        name: Video-TikTok-Prete-${{ github.run_id }}
        path: assets/final/final_short.mp4

