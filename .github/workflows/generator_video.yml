name: Générateur de Vidéos IA

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Sujet de la vidéo'
        required: true
        default: 'Le mystère des pyramides'

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Cloner le dépôt
      uses: actions/checkout@v3

    - name: ⚙️ Installer FFmpeg (Moteur vidéo)
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: 🐍 Configurer Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 Installer les dépendances
      run: pip install -r requirements.txt

    - name: 🎬 Générer la vidéo
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      # On simule l'entrée au clavier du sujet avec la commande "echo"
      run: echo "${{ github.event.inputs.topic }}" | python main.py 

    - name: 💾 Sauvegarder la vidéo finale
      uses: actions/upload-artifact@v3
      with:
        name: Video-TikTok-Prete
        path: assets/final/
