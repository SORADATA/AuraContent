name: Générateurs de Vidéos IA

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Sujet de la vidéo (laisser vide pour choix automatique par l'IA)"
        required: false
        default: ""

      duration:
        description: "Durée souhaitée en secondes (20 à 90)"
        required: false
        default: "45"

      refine_angle:
        description: "Laisser l'IA reformuler l'angle du sujet"
        required: false
        default: "true"

      use_hook_variants:
        description: "Tester plusieurs hooks avant génération"
        required: false
        default: "true"

  repository_dispatch:
    types: [trigger-videos]


jobs:

  # ==============================================================
  # FINANCE
  # DÉSACTIVÉ VOLONTAIREMENT
  # ==============================================================
  finance_generator:
    if: false

    runs-on: ubuntu-latest

    # Anciennement 45 min.
    # Augmenté pour éviter que GitHub termine le job pendant
    # une génération longue d'images / audio / vidéo.
    timeout-minutes: 90

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      HF_TOKEN: ${{ secrets.HF_TOKEN }}

      ZERNIO_API_KEYS_FINANCE: ${{ secrets.ZERNIO_API_KEYS_FINANCE }}

      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}

      VIDEO_TOPIC: ${{ github.event.inputs.topic || '' }}
      VIDEO_DURATION: ${{ github.event.inputs.duration || '45' }}
      REFINE_ANGLE: ${{ github.event.inputs.refine_angle || 'true' }}
      USE_HOOK_VARIANTS: ${{ github.event.inputs.use_hook_variants || 'true' }}

      WIKIMEDIA_CONTACT: ${{ secrets.WIKIMEDIA_CONTACT }}

      # Évite certains comportements Python liés au buffering
      PYTHONUNBUFFERED: "1"

    steps:

      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # FFMPEG
      # ------------------------------------------------------------
      - name: ⚙️ Installer FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg


      # ------------------------------------------------------------
      # POLICE
      # ------------------------------------------------------------
      - name: 🔤 Installer la police pour le watermark
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core


      # ------------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------------
      - name: 🐍 Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      # ------------------------------------------------------------
      # WHISPER
      # ------------------------------------------------------------
      - name: 🎙️ Installer whisper.cpp
        run: |
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp.git

          cd whisper.cpp

          bash ./models/download-ggml-model.sh base

          make -j"$(nproc)"


      # ------------------------------------------------------------
      # CACHE HUGGING FACE
      # ------------------------------------------------------------
      - name: 🗃️ Cache Hugging Face
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface

          key: ${{ runner.os }}-huggingface-${{ hashFiles('requirements.txt') }}

          restore-keys: |
            ${{ runner.os }}-huggingface-


      # ------------------------------------------------------------
      # DEPENDANCES
      # ------------------------------------------------------------
      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ------------------------------------------------------------
      # GENERATION FINANCE
      # ------------------------------------------------------------
      - name: 🎬 Générer la vidéo (Finance)
        timeout-minutes: 85
        run: |
          set -o pipefail

          for i in 1 2 3; do

            echo ""
            echo "============================================================"
            echo "🎬 Tentative $i / 3"
            echo "============================================================"
            echo ""

            START_TIME=$(date +%s)

            python -u main_finance.py 2>&1 | tee "generation_finance_attempt_${i}.log"
            EXIT_CODE=${PIPESTATUS[0]}

            END_TIME=$(date +%s)
            DURATION=$((END_TIME - START_TIME))

            echo ""
            echo "⏱️ Durée tentative $i : ${DURATION}s"
            echo "📌 Code retour : ${EXIT_CODE}"
            echo ""

            if [ "$EXIT_CODE" -eq 0 ]; then
              echo "============================================================"
              echo "✅ Génération Finance réussie"
              echo "============================================================"
              exit 0
            fi

            echo "============================================================"
            echo "❌ Échec de la tentative $i"
            echo "============================================================"

            if [ "$i" -lt 3 ]; then
              echo "⏳ Pause de 15 secondes avant nouvelle tentative..."
              sleep 15
            fi

          done

          echo ""
          echo "============================================================"
          echo "❌ Les 3 tentatives Finance ont échoué."
          echo "============================================================"

          exit 1


      # ------------------------------------------------------------
      # LOGS DES TENTATIVES
      # ------------------------------------------------------------
      - name: 💾 Sauvegarder les logs Finance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Logs-Finance-${{ github.run_id }}
          path: generation_finance_attempt_*.log
          if-no-files-found: warn


      # ------------------------------------------------------------
      # LOUDNESS
      # ------------------------------------------------------------
      - name: 🔊 Vérifier le niveau sonore
        if: always()
        run: |
          if [ -f assets/final/final_short.mp4 ]; then

            ffmpeg \
              -i assets/final/final_short.mp4 \
              -af loudnorm=print_format=summary \
              -f null - 2>&1 \
              | tee loudness_finance.txt

          else

            echo "Aucune vidéo finale trouvée." \
              | tee loudness_finance.txt

          fi


      # ------------------------------------------------------------
      # RAPPORT LOUDNESS
      # ------------------------------------------------------------
      - name: 💾 Sauvegarder le rapport (Finance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Loudness-Report-Finance-${{ github.run_id }}
          path: loudness_finance.txt
          if-no-files-found: warn


      # ------------------------------------------------------------
      # VIDEO
      # ------------------------------------------------------------
      - name: 💾 Sauvegarder la vidéo (Finance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Video-TikTok-Finance-${{ github.run_id }}
          path: assets/final/final_short.mp4
          if-no-files-found: warn


      # ------------------------------------------------------------
      # CAPTION
      # ------------------------------------------------------------
      - name: 💾 Sauvegarder la légende (Finance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Caption-Texte-Finance-${{ github.run_id }}
          path: caption.txt
          if-no-files-found: warn



  # ==============================================================
  # MINUTE MYSTERE
  # ==============================================================
  mystere_generator:

    runs-on: ubuntu-latest

    # IMPORTANT :
    # 45 minutes était trop juste puisque ton dernier run
    # atteignait environ 43 minutes avant "operation canceled".
    timeout-minutes: 90

    env:

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      HF_TOKEN: ${{ secrets.HF_TOKEN }}

      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}

      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      VIDEO_TOPIC: ${{ github.event.inputs.topic || '' }}
      VIDEO_DURATION: ${{ github.event.inputs.duration || '45' }}

      REFINE_ANGLE: ${{ github.event.inputs.refine_angle || 'true' }}
      USE_HOOK_VARIANTS: ${{ github.event.inputs.use_hook_variants || 'true' }}

      WIKIMEDIA_CONTACT: ${{ secrets.WIKIMEDIA_CONTACT }}

      # Force les logs Python à apparaître immédiatement
      PYTHONUNBUFFERED: "1"


    steps:

      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # FFMPEG
      # ------------------------------------------------------------
      - name: ⚙️ Installer FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg


      # ------------------------------------------------------------
      # POLICE WATERMARK
      # ------------------------------------------------------------
      - name: 🔤 Installer la police pour le watermark
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core


      # ------------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------------
      - name: 🐍 Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      # ------------------------------------------------------------
      # CACHE HUGGING FACE
      # ------------------------------------------------------------
      - name: 🗃️ Cache Hugging Face
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface

          key: ${{ runner.os }}-huggingface-${{ hashFiles('requirements.txt') }}

          restore-keys: |
            ${{ runner.os }}-huggingface-


      # ------------------------------------------------------------
      # DEPENDANCES
      # ------------------------------------------------------------
      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ------------------------------------------------------------
      # GENERATION MINUTE MYSTERE
      # ------------------------------------------------------------
      - name: 🎬 Générer la vidéo (Minute Mystere)
        timeout-minutes: 85
        run: |
          set -o pipefail

          for i in 1 2 3; do

            echo ""
            echo "============================================================"
            echo "🎬 Tentative $i / 3"
            echo "============================================================"
            echo ""

            START_TIME=$(date +%s)

            python -u main.py 2>&1 | tee "generation_mystere_attempt_${i}.log"
            EXIT_CODE=${PIPESTATUS[0]}

            END_TIME=$(date +%s)
            DURATION=$((END_TIME - START_TIME))

            echo ""
            echo "⏱️ Durée tentative $i : ${DURATION}s"
            echo "📌 Code retour : ${EXIT_CODE}"
            echo ""

            if [ "$EXIT_CODE" -eq 0 ]; then

              echo "============================================================"
              echo "✅ Génération Minute Mystere réussie"
              echo "============================================================"

              exit 0

            fi

            echo "============================================================"
            echo "❌ Échec de la tentative $i"
            echo "============================================================"

            if [ "$i" -lt 3 ]; then
              echo "⏳ Pause de 15 secondes avant nouvelle tentative..."
              sleep 15
            fi

          done

          echo ""
          echo "============================================================"
          echo "❌ Les 3 tentatives Minute Mystere ont échoué."
          echo "============================================================"

          exit 1


      # ------------------------------------------------------------
      # LOGS
      # ------------------------------------------------------------
      - name: 💾 Sauvegarder les logs (Minute Mystere)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Logs-MinuteMystere-${{ github.run_id }}
          path: generation_mystere_attempt_*.log
          if-no-files-found: warn


      # ------------------------------------------------------------
      # LOUDNESS
      # ------------------------------------------------------------
      - name: 🔊 Vérifier le niveau sonore
        if: always()
        run: |

          if [ -f assets/final/final_short.mp4 ]; then

            ffmpeg \
              -i assets/final/final_short.mp4 \
              -af loudnorm=print_format=summary \
              -f null - 2>&1 \
              | tee loudness_general.txt

          else

            echo "Aucune vidéo finale trouvée." \
              | tee loudness_general.txt

          fi


      # ------------------------------------------------------------
      # RAPPORT LOUDNESS
      # ------------------------------------------------------------
      - name: 💾 Sauvegarder le rapport (Minute Mystere)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Loudness-Report-MinuteMystere-${{ github.run_id }}
          path: loudness_general.txt
          if-no-files-found: warn


      # ------------------------------------------------------------
      # VIDEO
      # ------------------------------------------------------------
      - name: 💾 Sauvegarder la vidéo (Minute Mystere)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Video-TikTok-MinuteMystere-${{ github.run_id }}
          path: assets/final/final_short.mp4
          if-no-files-found: warn


      # ------------------------------------------------------------
      # CAPTION
      # ------------------------------------------------------------
      - name: 💾 Sauvegarder la légende (Minute Mystere)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Caption-Texte-MinuteMystere-${{ github.run_id }}
          path: caption.txt
          if-no-files-found: warn
